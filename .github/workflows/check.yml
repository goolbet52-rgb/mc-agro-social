name: Verificar código
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe JavaScript
        run: node --check app.js
      - name: Verificar arquivos essenciais
        run: test -s index.html && test -s app.js && test -s README.md
